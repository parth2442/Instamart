<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify - Mega Bazar</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0d0d;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; color: #fff;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 420px; width: 90%;
      text-align: center;
    }
    .logo {
      font-size: 48px; font-weight: 900;
      background: linear-gradient(135deg, #FFD700, #D4AF37);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
    p { color: #888; font-size: 14px; margin-bottom: 28px; }
    #status {
      margin-top: 20px; padding: 12px; border-radius: 8px; font-size: 14px;
      display: none;
    }
    #status.success { display: block; background: #0d3b1e; color: #4ade80; border: 1px solid #166534; }
    #status.error { display: block; background: #3b0d0d; color: #f87171; border: 1px solid #991b1b; }
    .cf-turnstile { display: inline-block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">MEGA BAZAR</div>
    <h1>Human Verification</h1>
    <p>Complete the captcha to verify your identity and unlock server access.</p>
    <div id="status"></div>
    <div class="cf-turnstile" data-sitekey="0x4AAAAAADzcNBZm4n0-QsGW" data-callback="onVerify" data-action="verify"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const userId = params.get('uid');
    const guildId = params.get('gid');

    if (!userId || !guildId) {
      document.getElementById('status').className = 'error';
      document.getElementById('status').textContent = 'Invalid verification link. Please try again.';
      document.getElementById('status').style.display = 'block';
    }

    async function onVerify(token) {
      const status = document.getElementById('status');
      status.className = '';
      status.style.display = 'none';

      try {
        const res = await fetch('/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, userId, guildId })
        });
        const data = await res.json();
        if (res.ok) {
          status.className = 'success';
          status.textContent = 'Verified! You can close this page and return to Discord.';
          status.style.display = 'block';
        } else {
          status.className = 'error';
          status.textContent = data.error || 'Verification failed. Try again.';
          status.style.display = 'block';
        }
      } catch (e) {
        status.className = 'error';
        status.textContent = 'Network error. Try again.';
        status.style.display = 'block';
      }
    }
  </script>
</body>
</html>
